<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>電子版脆皮捏捏樂 ASMR</title>
  <style>
    :root {
      --bg-top: #fff9f2;
      --bg-bottom: #f9e4d4;
      --card-bg: rgba(255, 255, 255, 0.78);
      --text-main: #4a3525;
      --text-muted: #8c6d56;
      --accent: #e87a3d;
      --accent-hover: #d46528;
      --shadow: 0 14px 35px rgba(130, 82, 46, 0.14);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: radial-gradient(circle at 50% 25%, var(--bg-top), var(--bg-bottom));
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px 28px;
      overflow: hidden;
      touch-action: manipulation;
    }

    /* 頂部資訊列 */
    header {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      z-index: 10;
    }

    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sound-toggle {
      background: var(--card-bg);
      border: 1.5px solid rgba(140, 109, 86, 0.2);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: transform 0.15s ease;
    }

    .sound-toggle:active {
      transform: scale(0.94);
    }

    /* 數據計數面板 */
    .stats-bar {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 10px 18px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 6px 20px rgba(130, 82, 46, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .stat-item {
      text-align: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .divider {
      width: 1px;
      height: 26px;
      background: rgba(140, 109, 86, 0.18);
    }

    /* 口味切換選單 */
    .flavor-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2px;
    }

    .flavor-btn {
      background: rgba(255, 255, 255, 0.65);
      border: 1.5px solid rgba(140, 109, 86, 0.2);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .flavor-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(232, 122, 61, 0.35);
    }

    /* 中央捏捏舞台 */
    .stage {
      position: relative;
      flex: 1;
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .squishy-wrapper {
      position: relative;
      width: 260px;
      height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform-origin: center bottom;
      transition: transform 0.32s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }

    /* 按壓時的形變 */
    .squishy-wrapper.pressed {
      transform: scaleX(1.18) scaleY(0.76) translateY(14px);
      transition: transform 0.06s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    /* 重新上脆皮的閃光動畫 */
    @keyframes glazeShine {
      0% { filter: brightness(1); transform: scale(1); }
      45% { filter: brightness(1.32) drop-shadow(0 0 18px rgba(255, 215, 110, 0.9)); transform: scale(1.06); }
      100% { filter: brightness(1); transform: scale(1); }
    }

    .squishy-wrapper.recoated {
      animation: glazeShine 0.45s ease;
    }

    .squishy-shadow {
      position: absolute;
      bottom: 14px;
      width: 210px;
      height: 30px;
      background: radial-gradient(ellipse at center, rgba(110, 68, 35, 0.26) 0%, rgba(110, 68, 35, 0) 72%);
      border-radius: 50%;
      transition: transform 0.25s ease;
      z-index: 1;
    }

    .squishy-wrapper.pressed + .squishy-shadow {
      transform: scaleX(1.22);
    }

    svg#squishySvg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 12px 18px rgba(120, 72, 36, 0.18));
    }

    .crack-line {
      fill: none;
      stroke: rgba(255, 255, 255, 0.85);
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .crack-line.visible {
      opacity: 1;
    }

    .hint-text {
      margin-top: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0.85;
      pointer-events: none;
    }

    /* 底部操作按鈕 */
    footer {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 10;
    }

    .action-btn {
      background: #fff;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: 700;
      padding: 11px 22px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(232, 122, 61, 0.16);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }

    .action-btn:hover {
      background: var(--accent);
      color: #fff;
    }

    .action-btn:active {
      transform: scale(0.95);
    }

    /* 飛濺碎屑與擬聲詞特效 */
    .crumb {
      position: fixed;
      pointer-events: none;
      z-index: 20;
      border-radius: 3px;
    }

    .pop-word {
      position: fixed;
      pointer-events: none;
      z-index: 25;
      font-weight: 900;
      font-size: 1.15rem;
      color: var(--accent);
      text-shadow: 0 2px 0 #fff, 0 -2px 0 #fff, 2px 0 0 #fff, -2px 0 0 #fff;
      animation: floatUp 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(-6deg);
      }
      40% {
        opacity: 1;
        transform: translate(-50%, -115%) scale(1.15) rotate(4deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -165%) scale(0.95) rotate(0deg);
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-row">
      <h1>🍮 電子脆皮捏捏樂</h1>
      <button class="sound-toggle" id="soundToggle" type="button">🔊 音效開啟</button>
    </div>

    <div class="stats-bar">
      <div class="stat-item">
        <div class="stat-label">捏脆次數</div>
        <div class="stat-value" id="squishCount">0</div>
      </div>
      <div class="divider"></div>
      <div class="stat-item">
        <div class="stat-label">脆皮裂度</div>
        <div class="stat-value" id="crackPercent">0%</div>
      </div>
    </div>

    <div class="flavor-tabs" id="flavorTabs">
      <button class="flavor-btn active" data-flavor="caramel">🍯 焦糖糖衣</button>
      <button class="flavor-btn" data-flavor="choco">🍫 脆皮巧克力</button>
      <button class="flavor-btn" data-flavor="matcha">🍵 抹茶脆殼</button>
      <button class="flavor-btn" data-flavor="strawberry">🍓 草莓糖霜</button>
    </div>
  </header>

  <main class="stage">
    <div class="squishy-wrapper" id="squishy" role="button" aria-label="點擊捏碎脆皮">
      <svg id="squishySvg" viewBox="0 0 260 240">
        <defs>
          <!-- 內部軟Q主體漸層 -->
          <radialGradient id="innerGrad" cx="42%" cy="32%" r="68%">
            <stop offset="0%" stop-color="#fff4c2" id="stopInner1" />
            <stop offset="65%" stop-color="#ffd56b" id="stopInner2" />
            <stop offset="100%" stop-color="#f2a93b" id="stopInner3" />
          </radialGradient>

          <!-- 外層半透明脆皮糖衣漸層 -->
          <linearGradient id="crustGrad" x1="0%" y1="0%" x2="15%" y2="100%">
            <stop offset="0%" stop-color="#ffb347" stop-opacity="0.72" id="stopCrust1" />
            <stop offset="55%" stop-color="#d96b1f" stop-opacity="0.58" id="stopCrust2" />
            <stop offset="100%" stop-color="#9e3f0e" stop-opacity="0.75" id="stopCrust3" />
          </linearGradient>
        </defs>

        <!-- 軟Q內芯 -->
        <path d="M 42 175 C 32 115, 58 48, 130 48 C 202 48, 228 115, 218 175 C 212 204, 178 214, 130 214 C 82 214, 48 204, 42 175 Z"
              fill="url(#innerGrad)" />

        <!-- 可愛表情（正常狀態） -->
        <g id="faceNormal">
          <circle cx="102" cy="142" r="6.5" fill="#593822" />
          <circle cx="100" cy="140" r="2.2" fill="#ffffff" />
          <circle cx="158" cy="142" r="6.5" fill="#593822" />
          <circle cx="156" cy="140" r="2.2" fill="#ffffff" />
          <ellipse cx="86" cy="153" rx="9" ry="5" fill="#ff8a8a" opacity="0.55" />
          <ellipse cx="174" cy="153" rx="9" ry="5" fill="#ff8a8a" opacity="0.55" />
          <path d="M 121 151 Q 130 160 139 151" fill="none" stroke="#593822" stroke-width="3.5" stroke-linecap="round" />
        </g>

        <!-- 可愛表情（被捏扁狀態） -->
        <g id="faceSquished" style="display: none;">
          <path d="M 94 137 L 108 144 L 94 150" fill="none" stroke="#593822" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M 166 137 L 152 144 L 166 150" fill="none" stroke="#593822" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
          <ellipse cx="86" cy="155" rx="11" ry="6" fill="#ff7373" opacity="0.7" />
          <ellipse cx="174" cy="155" rx="11" ry="6" fill="#ff7373" opacity="0.7" />
          <path d="M 118 156 Q 130 146 142 156" fill="none" stroke="#593822" stroke-width="3.5" stroke-linecap="round" />
        </g>

        <!-- 外層脆皮殼 -->
        <path d="M 39 175 C 29 112, 56 44, 130 44 C 204 44, 231 112, 221 175 C 215 206, 180 217, 130 217 C 80 217, 45 206, 39 175 Z"
              fill="url(#crustGrad)" stroke="rgba(255,255,255,0.45)" stroke-width="2" />

        <!-- 脆皮高光反光（營造玻璃糖衣脆感） -->
        <path d="M 74 78 Q 102 56 138 58" fill="none" stroke="rgba(255, 255, 255, 0.78)" stroke-width="7" stroke-linecap="round" />
        <circle cx="63" cy="92" r="4" fill="rgba(255, 255, 255, 0.75)" />

        <!-- 脆皮裂痕群組（隨點擊逐步顯示） -->
        <g id="cracksGroup">
          <path class="crack-line" d="M 126 46 L 118 72 L 134 92 L 122 114" />
          <path class="crack-line" d="M 118 72 L 95 84 L 82 106" />
          <path class="crack-line" d="M 134 92 L 160 102 L 178 90" />
          <path class="crack-line" d="M 62 126 L 86 134 L 98 158 L 80 182" />
          <path class="crack-line" d="M 196 122 L 172 138 L 184 164 L 166 190" />
          <path class="crack-line" d="M 122 114 L 142 132 L 132 162 L 146 196" />
          <path class="crack-line" d="M 98 158 L 118 176 L 106 208" />
          <path class="crack-line" d="M 172 138 L 154 156 L 174 176" />
        </g>
      </svg>
    </div>
    <div class="squishy-shadow"></div>
    <div class="hint-text">直接點擊或長按捏扁，聽清脆破裂聲！</div>
  </main>

  <footer>
    <button class="action-btn" id="recoatBtn" type="button">✨ 重新裹上脆皮</button>
  </footer>

  <script>
    // 口味設定：顏色、聲音頻率特性、碎屑顏色與擬聲詞
    const FLAVORS = {
      caramel: {
        inner: ['#fff4c2', '#ffd56b', '#f2a93b'],
        crust: ['#ffb347', '#d96b1f', '#9e3f0e'],
        crumbs: ['#f59e0b', '#d97706', '#fef08a', '#b45309'],
        words: ['咔嚓！', '喀滋！', '脆！', '啵脆！', '酥脆！'],
        freqBase: 2600,
        qValue: 2.4
      },
      choco: {
        inner: ['#f3d5b5', '#d4a373', '#a97142'],
        crust: ['#6f4e37', '#4a3020', '#2c1a10'],
        crumbs: ['#5c3a21', '#3b2313', '#8c5a32', '#d4a373'],
        words: ['喀滋！', '咔嚓！', '濃脆！', '啪嚓！'],
        freqBase: 1950,
        qValue: 1.9
      },
      matcha: {
        inner: ['#f4f9e9', '#cfe1b9', '#97a97c'],
        crust: ['#718355', '#4f6d3a', '#2d4722'],
        crumbs: ['#6a994e', '#386641', '#a7c957', '#f2e8cf'],
        words: ['咔嚓！', '清脆！', '喀滋！', '酥！'],
        freqBase: 2400,
        qValue: 2.2
      },
      strawberry: {
        inner: ['#fff0f3', '#ffccd5', '#ff8fa3'],
        crust: ['#ff4d6d', '#c9184a', '#800f2f'],
        crumbs: ['#ff4d6d', '#ff758f', '#fff0f3', '#c9184a'],
        words: ['啵脆！', '咔嚓！', '喀滋！', '甜脆！'],
        freqBase: 2900,
        qValue: 2.8
      }
    };

    let currentFlavor = 'caramel';
    let squishCount = 0;
    let crackStage = 0;
    let soundEnabled = true;

    const squishyEl = document.getElementById('squishy');
    const faceNormal = document.getElementById('faceNormal');
    const faceSquished = document.getElementById('faceSquished');
    const crackLines = Array.from(document.querySelectorAll('.crack-line'));
    const squishCountEl = document.getElementById('squishCount');
    const crackPercentEl = document.getElementById('crackPercent');
    const soundToggleBtn = document.getElementById('soundToggle');
    const recoatBtn = document.getElementById('recoatBtn');
    const flavorBtns = document.querySelectorAll('.flavor-btn');

    // Web Audio API 清脆音效合成器
    let audioCtx = null;
    let noiseBuffer = null;

    function initAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        // 預先產生 1 秒白噪音緩衝區，確保點擊零延遲
        const bufferSize = audioCtx.sampleRate * 1.0;
        noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playCrispySound() {
      if (!soundEnabled) return;
      initAudio();

      const now = audioCtx.currentTime;
      const flavorCfg = FLAVORS[currentFlavor];

      // 1. 多重清脆裂響（4~6 個微秒級錯開的高頻爆裂聲）
      const burstCount = 5;
      for (let i = 0; i < burstCount; i++) {
        const delay = i * (0.012 + Math.random() * 0.018);
        const duration = 0.022 + Math.random() * 0.025;

        const noise = audioCtx.createBufferSource();
        noise.buffer = noiseBuffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        // 每次微調頻率，讓每次按壓的脆聲都有自然變化
        filter.frequency.setValueAtTime(
          flavorCfg.freqBase * (0.85 + Math.random() * 0.45),
          now + delay
        );
        filter.Q.setValueAtTime(flavorCfg.qValue, now + delay);

        const gain = audioCtx.createGain();
        const peakGain = (0.55 - i * 0.07) * (0.85 + Math.random() * 0.3);
        gain.gain.setValueAtTime(0.001, now + delay);
        gain.gain.linearRampToValueAtTime(peakGain, now + delay + 0.003);
        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now + delay, Math.random() * 0.5, duration);
      }

      // 2. 高頻糖衣脆響瞬態（增加「清脆」亮感）
      const snapOsc = audioCtx.createOscillator();
      const snapGain = audioCtx.createGain();
      snapOsc.type = 'triangle';
      snapOsc.frequency.setValueAtTime(1400 + Math.random() * 500, now);
      snapOsc.frequency.exponentialRampToValueAtTime(320, now + 0.035);

      snapGain.gain.setValueAtTime(0.22, now);
      snapGain.gain.exponentialRampToValueAtTime(0.001, now + 0.035);

      snapOsc.connect(snapGain);
      snapGain.connect(audioCtx.destination);
      snapOsc.start(now);
      snapOsc.stop(now + 0.04);

      // 3. 內部軟Q捏捏回彈低音
      const squishOsc = audioCtx.createOscillator();
      const squishGain = audioCtx.createGain();
      squishOsc.type = 'sine';
      squishOsc.frequency.setValueAtTime(165, now);
      squishOsc.frequency.exponentialRampToValueAtTime(68, now + 0.09);

      squishGain.gain.setValueAtTime(0.25, now);
      squishGain.gain.exponentialRampToValueAtTime(0.001, now + 0.095);

      squishOsc.connect(squishGain);
      squishGain.connect(audioCtx.destination);
      squishOsc.start(now);
      squishOsc.stop(now + 0.1);
    }

    // 噴發脆皮碎屑與擬聲詞
    function spawnParticles(x, y) {
      const flavorCfg = FLAVORS[currentFlavor];

      // 擬聲詞氣泡
      const word = document.createElement('div');
      word.className = 'pop-word';
      word.textContent = flavorCfg.words[Math.floor(Math.random() * flavorCfg.words.length)];
      word.style.left = `${x + (Math.random() * 30 - 15)}px`;
      word.style.top = `${y - 18}px`;
      document.body.appendChild(word);
      setTimeout(() => word.remove(), 650);

      // 脆片碎屑（8~12 片）
      const count = 10;
      for (let i = 0; i < count; i++) {
        const crumb = document.createElement('div');
        crumb.className = 'crumb';
        const size = 5 + Math.random() * 6;
        crumb.style.width = `${size}px`;
        crumb.style.height = `${size * (0.6 + Math.random() * 0.6)}px`;
        crumb.style.backgroundColor = flavorCfg.crumbs[Math.floor(Math.random() * flavorCfg.crumbs.length)];
        crumb.style.left = `${x}px`;
        crumb.style.top = `${y}px`;
        document.body.appendChild(crumb);

        const angle = Math.random() * Math.PI * 2;
        const velocity = 45 + Math.random() * 85;
        const tx = Math.cos(angle) * velocity;
        const ty = Math.sin(angle) * velocity + 45; // 加上微重力下墜
        const rot = (Math.random() - 0.5) * 360;

        crumb.animate([
          { transform: 'translate(-50%, -50%) scale(1) rotate(0deg)', opacity: 1 },
          { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.3) rotate(${rot}deg)`, opacity: 0 }
        ], {
          duration: 420 + Math.random() * 200,
          easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
        }).onfinish = () => crumb.remove();
      }
    }

    // 按下捏扁事件
    function handlePressDown(e) {
      e.preventDefault();
      squishyEl.classList.add('pressed');
      faceNormal.style.display = 'none';
      faceSquished.style.display = 'block';

      // 播放清脆聲響
      playCrispySound();

      // 手機短震動回饋
      if (navigator.vibrate) {
        navigator.vibrate(18);
      }

      // 更新次數與裂痕
      squishCount++;
      squishCountEl.textContent = squishCount;

      if (crackStage < crackLines.length) {
        crackLines[crackStage].classList.add('visible');
        crackStage++;
        const percent = Math.round((crackStage / crackLines.length) * 100);
        crackPercentEl.textContent = `${percent}%`;
      }

      // 取得點擊座標產生碎屑
      const rect = squishyEl.getBoundingClientRect();
      const clientX = e.clientX || (rect.left + rect.width / 2);
      const clientY = e.clientY || (rect.top + rect.height / 2);
      spawnParticles(clientX, clientY);
    }

    // 放開回彈事件
    function handlePressUp() {
      squishyEl.classList.remove('pressed');
      faceNormal.style.display = 'block';
      faceSquished.style.display = 'none';
    }

    squishyEl.addEventListener('pointerdown', handlePressDown);
    window.addEventListener('pointerup', handlePressUp);
    window.addEventListener('pointercancel', handlePressUp);

    // 重新裹上脆皮（清除裂痕）
    recoatBtn.addEventListener('click', () => {
      crackStage = 0;
      crackLines.forEach(line => line.classList.remove('visible'));
      crackPercentEl.textContent = '0%';

      squishyEl.classList.remove('recoated');
      void squishyEl.offsetWidth; // 觸發重繪重新播放動畫
      squishyEl.classList.add('recoated');
    });

    // 切換口味
    flavorBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        flavorBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFlavor = btn.dataset.flavor;

        const cfg = FLAVORS[currentFlavor];
        document.getElementById('stopInner1').setAttribute('stop-color', cfg.inner[0]);
        document.getElementById('stopInner2').setAttribute('stop-color', cfg.inner[1]);
        document.getElementById('stopInner3').setAttribute('stop-color', cfg.inner[2]);

        document.getElementById('stopCrust1').setAttribute('stop-color', cfg.crust[0]);
        document.getElementById('stopCrust2').setAttribute('stop-color', cfg.crust[1]);
        document.getElementById('stopCrust3').setAttribute('stop-color', cfg.crust[2]);

        // 切換口味時順便重新上脆皮
        recoatBtn.click();
      });
    });

    // 音效開關
    soundToggleBtn.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      soundToggleBtn.textContent = soundEnabled ? '🔊 音效開啟' : '🔇 音效靜音';
    });
  </script>
</body>
</html>
